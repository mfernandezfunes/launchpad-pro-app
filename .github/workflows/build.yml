name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: Launchpad-Sampler-macOS.zip
          - os: windows-latest
            artifact_name: Launchpad-Sampler-Windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyinstaller PyQt6 python-rtmidi sounddevice soundfile numpy

      - name: Build
        run: pyinstaller launchpad-sampler.spec --noconfirm

      - name: Package macOS
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../Launchpad-Sampler-macOS.zip "Launchpad Sampler.app"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Launchpad Sampler.exe" -DestinationPath Launchpad-Sampler-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
